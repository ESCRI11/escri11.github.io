<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Academic Work - Personal Website</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="academic-work-page">
    <!-- atmosphere: L1 dot grid · aurora washes · L2 particle field · film grain -->
    <div class="grid-layer" aria-hidden="true"></div>
    <div class="wash" aria-hidden="true"></div>
    <canvas id="dots" aria-hidden="true"></canvas>
    <svg class="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><filter id="grain-noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#grain-noise)"/></svg>

    <header>
        <div class="header-content">
            <button id="menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav>
                <ul></ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="academic-layout">
            <nav class="section-nav">
                <ul>
                    <li><a href="#papers">Papers</a></li>
                    <li><a href="#posters">Posters</a></li>
                    <li><a href="#public-talks">Public Talks</a></li>
                    <li><a href="#workshops">Workshops</a></li>
                </ul>
            </nav>
            <div class="academic-content">
                <div id="academic-work-container"></div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; <span id="current-year"></span> <span id="footer-name"></span></p>
    </footer>
    <script src="script.js"></script>
    <script src="assets/particles.js" defer></script>
</body>
</html>
