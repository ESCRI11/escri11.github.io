<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Personal Website</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="home-page">
    <!-- atmosphere: L1 dot grid · aurora washes · L2 particle field · film grain -->
    <div class="grid-layer" aria-hidden="true"></div>
    <div class="wash" aria-hidden="true"></div>
    <canvas id="dots" aria-hidden="true"></canvas>
    <svg class="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><filter id="grain-noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#grain-noise)"/></svg>

    <header>
        <div class="header-content">
            <a class="brand" id="header-name" href="index.html"></a>
            <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav>
                <ul></ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero-text">
                <h1 id="name"></h1>
                <p id="tagline" class="tagline"></p>
                <p id="location" class="coords"></p>
                <div id="social-links" class="links"></div>
            </div>
            <!-- L3 focal object: skeleton-movement dot-globe (assets/hero-globe.js) -->
            <div class="portrait" aria-hidden="true">
                <canvas id="halftone" width="380" height="380"></canvas>
            </div>
        </section>
        <section class="blk">
            <h2 id="about-label"></h2>
            <p id="about" class="body-copy"></p>
        </section>
    </main>
    <footer>
        <p>&copy; <span id="current-year"></span> <span id="footer-name"></span></p>
        <p id="build-line" class="build"></p>
    </footer>
    <script src="script.js"></script>
    <script src="assets/particles.js" defer></script>
    <script src="assets/hero-globe.js" defer></script>
</body>
</html>
